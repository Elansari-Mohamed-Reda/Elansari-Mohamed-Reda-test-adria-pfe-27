server:
  address: 127.0.0.1
  port: 8082

spring:
  profiles:
    default: standalone
  ai:
    mcp:
      server:
        name: transaction-service
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
  cloud:
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        enableSemaphoreDefaultBulkhead: false
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 2000
  application:
    name: transaction-service
  datasource:
    url: "${TRANSACTION_DB_URL:jdbc:h2:file:./data/transaction-service;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}"
    username: ${TRANSACTION_DB_USERNAME:sa}
    password: ${TRANSACTION_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

bank:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://127.0.0.1:8081}
  transaction:
    max-amount: ${BANK_TRANSACTION_MAX_AMOUNT:1000}

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - ma.adria.transaction.service.exception.TransactionRejectedException
