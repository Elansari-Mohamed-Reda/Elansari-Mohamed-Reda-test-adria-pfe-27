server:
  address: 127.0.0.1
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: "${ACCOUNT_DB_URL:jdbc:h2:file:./data/account-service;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${ACCOUNT_DB_USERNAME:sa}
    password: ${ACCOUNT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true